name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        run: pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build and start stack
        run: docker compose --profile ui up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8088/api/health | grep -q '"ok"'; then
              echo "backend ready"; exit 0
            fi
            sleep 3
          done
          docker compose --profile ui logs backend
          exit 1

      - name: Smoke test core APIs
        run: |
          set -e
          BASE=http://localhost:8088/api/v1
          TOKEN=$(curl -fsS -X POST $BASE/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin1","password":"123456"}' \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          for path in /dashboard/home /dashboard/intraday /dashboard/sales /live-sessions /orders /products /stores; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose --profile ui logs --tail=200
